name: Agent test set

# Asks the live site the 30 questions an agent asks (API, OpenAPI, MCP, feeds, llms.txt, health)
# and keeps one `alert` issue open while any fail. Read only.
# GitHub runs schedules on this private repo hours late or not at all, so the set runs three times
# a day. It is read only; each run syncs the same single alert issue.
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 13 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-tests
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Ask the 30 questions and sync the alert issue
        run: node scripts/agent-tests.mjs https://securitythreatpulse.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
