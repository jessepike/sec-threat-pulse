name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (sample mode, no database)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          AUTH_GITHUB_ID: ci-dummy
          AUTH_GITHUB_SECRET: ci-dummy
          ADMIN_GITHUB_LOGINS: ci-dummy

  # Improve loop pull requests (improve/... branches) only: tier, review panel label, rules notice,
  # owner-only files and the PAUSE switch. See docs/improve/program.md. Other pull requests pass.
  improve-gate:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'improve/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/improve/gate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
