name: Freshness probe

# Checks the live site from outside Vercel. The site's own health check runs inside the cron it
# watches, so it goes quiet exactly when that cron dies. This one does not.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Drill: pretend the site is stale or down to prove the alert path"
        type: choice
        options: ["", "stale", "down"]
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Probe /status.json and sync the alert issue
        run: node scripts/ops/freshness-probe.mjs https://securitythreatpulse.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULATE: ${{ inputs.simulate }}
